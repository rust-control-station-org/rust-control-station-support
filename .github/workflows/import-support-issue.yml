name: Import accepted support issue

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: write

concurrency:
  group: import-support-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  import:
    name: Import issue to private repository
    if: >-
      contains(
        fromJSON('["mazurk4", "safinfin", "NekosanQ", "coinvy"]'),
        github.actor
      ) &&
      github.event.label.name == 'accepted' &&
      !contains(github.event.issue.labels.*.name, 'imported')
    runs-on: ubuntu-latest

    steps:
      - name: Create internal issue
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_ISSUES_TOKEN }}
          TARGET_REPO: rust-control-station-org/rust-control-station
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_URL: ${{ github.event.issue.html_url }}
          SOURCE_AUTHOR: ${{ github.event.issue.user.login }}
          SOURCE_CREATED_AT: ${{ github.event.issue.created_at }}
          SOURCE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          # 通常の再実行で重複しないよう、同じ番号の内部 Issue を確認する。
          existing_issue="$(
            gh issue list \
              --repo "${TARGET_REPO}" \
              --state all \
              --search "\"[Support #${SOURCE_NUMBER}]\" in:title" \
              --json number,title \
              --jq '
                map(
                  select(
                    .title
                    | startswith("[Support #'"${SOURCE_NUMBER}"']")
                  )
                )
                | first
                | .number // empty
              '
          )"

          if [[ -n "${existing_issue}" ]]; then
            echo "Internal issue already exists: #${existing_issue}"
            exit 0
          fi

          original_body="${ISSUE_BODY:-_No description was provided._}"

          internal_body="$(
            cat <<EOF
          <!-- support-source: ${SOURCE_REPO}#${SOURCE_NUMBER} -->

          ## Support issue information

          - **Source:** ${SOURCE_URL}
          - **Reporter:** @${SOURCE_AUTHOR}
          - **Created:** ${SOURCE_CREATED_AT}
          - **Source labels:** ${SOURCE_LABELS:-None}

          ## Original report

          ${original_body}

          ---

          This issue was imported automatically from the public support repository.
          EOF
          )"

          gh issue create \
            --repo "${TARGET_REPO}" \
            --title "[Support #${SOURCE_NUMBER}] ${ISSUE_TITLE}" \
            --body "${internal_body}" \
            --label "from-support"

      - name: Mark source issue as imported
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          gh issue edit "${SOURCE_NUMBER}" \
            --repo "${SOURCE_REPO}" \
            --add-label "imported"

          gh issue comment "${SOURCE_NUMBER}" \
            --repo "${SOURCE_REPO}" \
            --body "Thank you for the report. This issue has been reviewed and registered in our internal development tracker. Additional information and public updates will continue to be handled in this issue."
